<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}News Portal{% endblock title %}</title>
    {% load static %}
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body>
    <header>
        <h1><a href="/news/">News Portal</a></h1>
        <nav>
            <a href="/news/">Новости</a> |
            <a href="/news/search/">Поиск</a> |
            <a href="/news/create/">Добавить новость</a> |
            <a href="/articles/create/">Добавить статью</a> |
            {% if user.is_authenticated %}
                <a href="/sign/profile/">Профиль</a> |
                <a href="/accounts/logout/">Выйти</a>
            {% else %}
                <a href="/accounts/login/">Войти</a> |
                <a href="/accounts/signup/">Регистрация</a>
            {% endif %}
        </nav>
        <hr>
    </header>

    {% block content %}
    {% endblock content %}
</body>
</html>
